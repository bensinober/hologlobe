<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js PLY Loader</title>
    <style>
        body { margin: 0 overflow: hidden }
        .container {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            margin: 1em;
        }
        .controls {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
            "three": "./js/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <div>
            <canvas id="outCanvas" width="1080" height="540" style="border:1px solid #000000;"></canvas>
        </div>
        <div class="controls">
            <ul>
                <li>
                    <label for="plyUpload">PLY</label>
                    <input type="file" id="plyUpload" accept=".ply, text/plain" />
                </li>
                <li>
                    <label for="gltfUpload">GLTF</label>
                    <input type="file" id="gltfUpload" accept=".gltf, .glb, text/plain" />
                </li>
                <li>
                    <label for="plyUpload">OBJ</label>
                    <input type="file" id="objUpload" accept=".obj, text/plain" />
                </li>
                <li><button id="startBtn">kjør!</button></li>
                <li><button id="clearBtn">tøm</button></li>
                <li><button id="downloadBtn" disabled>Last ned PNG</button></li>
            </ul>
        </div>
    </div>
    <canvas id="meshCanvas" width="1080" height="540" style="border:1px solid #000000;"></canvas>
    <script type="module">
        //import * as THREE from "three"

        import { setupScene } from "./mesh.js";

        document.addEventListener("DOMContentLoaded", async function () {
            setupScene();
        })
    </script>
</body>
</html>
